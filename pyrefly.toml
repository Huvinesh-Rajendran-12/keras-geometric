# Include all Python files in the src and tests directories
project_includes = ["src/**/*.py", "tests/**/*.py", "examples/**/*.py"]

# Standard Python library to ignore for type checking
replace_imports_with_any = ["tests.*", "tensorflow.*", "torch.*", "torch_geometric.*", "numpy.*"]

# Python version to use for type checking
python_version = "3.9"

# Disable specific error kinds
[errors]
# These are disabled globally due to the nature of multi-backend support and Keras patterns
bad-argument-type = false  # Complex tensor operations across backends
missing-attribute = false  # Optional imports like torch
not-callable = false       # Optional imports that might be None
bad-return = false         # Complex tensor operations return types

# These errors are expected in Keras layers due to lazy initialization
implicitly-defined-attribute = false  # Attributes defined in build() method
bad-override = false  # Keras method signatures can vary
